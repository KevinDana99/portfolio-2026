<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Panel de Inteligencia Fiscal Jujuy</title>
  <desc id="desc">Vista conceptual de una plataforma fiscal con indicadores, alertas y actividad tributaria.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10162a"/>
      <stop offset="1" stop-color="#080b16"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6088ff"/>
      <stop offset="1" stop-color="#59d0a6"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6088ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#6088ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#background)"/>
  <circle cx="736" cy="22" r="170" fill="#3b5bdb" opacity=".08"/>
  <circle cx="64" cy="440" r="140" fill="#59d0a6" opacity=".04"/>

  <g filter="url(#shadow)">
    <rect x="34" y="28" width="732" height="394" rx="18" fill="#12182a" stroke="#29324d"/>
  </g>

  <rect x="34" y="28" width="154" height="394" rx="18" fill="#0d1221"/>
  <path d="M188 28v394" stroke="#29324d"/>
  <circle cx="61" cy="59" r="12" fill="#6088ff"/>
  <path d="M55 59h12M61 53v12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="82" y="57" fill="#f2f5ff" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">INTELIGENCIA</text>
  <text x="82" y="71" fill="#8793ad" font-family="Inter, Arial, sans-serif" font-size="9">FISCAL JUJUY</text>

  <g font-family="Inter, Arial, sans-serif" font-size="10">
    <rect x="48" y="102" width="126" height="34" rx="8" fill="#3b5bdb" opacity=".2"/>
    <circle cx="65" cy="119" r="4" fill="#6088ff"/>
    <text x="78" y="123" fill="#dce5ff" font-weight="600">Resumen fiscal</text>
    <circle cx="65" cy="159" r="4" fill="#56627b"/>
    <text x="78" y="163" fill="#8793ad">Contribuyentes</text>
    <circle cx="65" cy="198" r="4" fill="#56627b"/>
    <text x="78" y="202" fill="#8793ad">Declaraciones</text>
    <circle cx="65" cy="237" r="4" fill="#56627b"/>
    <text x="78" y="241" fill="#8793ad">Fiscalización</text>
    <circle cx="65" cy="276" r="4" fill="#56627b"/>
    <text x="78" y="280" fill="#8793ad">Reportes</text>
  </g>

  <text x="216" y="61" fill="#f2f5ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Panel de gestión fiscal</text>
  <text x="216" y="79" fill="#75819b" font-family="Inter, Arial, sans-serif" font-size="10">Indicadores consolidados · Provincia de Jujuy</text>
  <rect x="660" y="50" width="78" height="27" rx="8" fill="#1b2339" stroke="#303b59"/>
  <circle cx="675" cy="63.5" r="3" fill="#59d0a6"/>
  <text x="685" y="67" fill="#b9c3d8" font-family="Inter, Arial, sans-serif" font-size="9">Actualizado</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="216" y="101" width="160" height="72" rx="12" fill="#171f34" stroke="#2b3550"/>
    <text x="231" y="123" fill="#7f8ba5" font-size="9">RECAUDACIÓN DEL MES</text>
    <text x="231" y="151" fill="#f5f7ff" font-size="21" font-weight="700">$ 4.82 mil M</text>
    <text x="322" y="151" fill="#59d0a6" font-size="9" font-weight="600">+12.4%</text>

    <rect x="391" y="101" width="160" height="72" rx="12" fill="#171f34" stroke="#2b3550"/>
    <text x="406" y="123" fill="#7f8ba5" font-size="9">CONTRIBUYENTES ACTIVOS</text>
    <text x="406" y="151" fill="#f5f7ff" font-size="21" font-weight="700">28.461</text>
    <text x="489" y="151" fill="#8faaff" font-size="9" font-weight="600">+3.1%</text>

    <rect x="566" y="101" width="172" height="72" rx="12" fill="#171f34" stroke="#2b3550"/>
    <text x="581" y="123" fill="#7f8ba5" font-size="9">ALERTAS PARA REVISIÓN</text>
    <text x="581" y="151" fill="#f5f7ff" font-size="21" font-weight="700">126</text>
    <rect x="628" y="136" width="69" height="18" rx="9" fill="#efb44d" opacity=".13"/>
    <text x="641" y="148" fill="#efc36f" font-size="8" font-weight="600">Prioridad alta</text>
  </g>

  <rect x="216" y="189" width="338" height="201" rx="12" fill="#151d31" stroke="#2b3550"/>
  <text x="234" y="215" fill="#dce3f3" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Evolución de la recaudación</text>
  <text x="491" y="215" fill="#75819b" font-family="Inter, Arial, sans-serif" font-size="8">Últimos 6 meses</text>
  <path d="M238 246H533M238 283H533M238 320H533M238 357H533" stroke="#2a344e" stroke-width="1"/>
  <path d="M239 344C268 330 286 337 313 309S355 313 383 278 429 296 458 254 504 248 532 228V369H239Z" fill="url(#area)"/>
  <path d="M239 344C268 330 286 337 313 309S355 313 383 278 429 296 458 254 504 248 532 228" fill="none" stroke="url(#chart)" stroke-width="3" stroke-linecap="round"/>
  <g fill="#6088ff" stroke="#dce5ff" stroke-width="1.5">
    <circle cx="313" cy="309" r="4"/><circle cx="383" cy="278" r="4"/><circle cx="458" cy="254" r="4"/><circle cx="532" cy="228" r="4"/>
  </g>
  <g fill="#65718b" font-family="Inter, Arial, sans-serif" font-size="8">
    <text x="239" y="381">MAY</text><text x="296" y="381">JUN</text><text x="354" y="381">JUL</text><text x="412" y="381">AGO</text><text x="470" y="381">SEP</text><text x="515" y="381">OCT</text>
  </g>

  <rect x="570" y="189" width="168" height="201" rx="12" fill="#151d31" stroke="#2b3550"/>
  <text x="588" y="215" fill="#dce3f3" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Actividad reciente</text>
  <g font-family="Inter, Arial, sans-serif">
    <circle cx="592" cy="243" r="5" fill="#59d0a6"/>
    <text x="606" y="242" fill="#cbd3e4" font-size="9">Pago acreditado</text>
    <text x="606" y="254" fill="#65718b" font-size="8">Ingresos Brutos · hace 4 min</text>
    <path d="M588 270h132" stroke="#29334c"/>
    <circle cx="592" cy="291" r="5" fill="#6088ff"/>
    <text x="606" y="290" fill="#cbd3e4" font-size="9">Declaración procesada</text>
    <text x="606" y="302" fill="#65718b" font-size="8">Período 09/2026 · hace 18 min</text>
    <path d="M588 318h132" stroke="#29334c"/>
    <circle cx="592" cy="339" r="5" fill="#efb44d"/>
    <text x="606" y="338" fill="#cbd3e4" font-size="9">Alerta detectada</text>
    <text x="606" y="350" fill="#65718b" font-size="8">Validación pendiente · hace 32 min</text>
